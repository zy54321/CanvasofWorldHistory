# 《世界历史时空画布》—— 本地沙箱数据库（LOCAL SANDBOX ONLY）
#
# ⚠ 本文件不再管理任何生产资源。
#
# 2026-11-10 起，PROD 的唯一编排入口是：
#     E:\01_Work\04_Prod\01_Personal\canvas-history\compose.yaml
# 版本化来源：
#     scripts\release\templates\compose.yaml
#
# 本文件的历史身份是「阶段一基础设施 / 生产库定义」，因此曾与 App Compose
# 共同占用 canvas-history 项目名，形成两个 YAML 管一个项目的隐患。
# 现在它被显式降级为一个**与本机任何生产资源都不共享**的本地沙箱：
#   · 项目名    canvas-history-local     （不再是 canvas-history）
#   · 容器名    canvas-history-db-local  （不再是 canvas-history-db）
#   · 数据卷    canvas-history-local-pgdata（不再是 canvas-history-pgdata）
#   · 宿主端口  55432                    （不占用生产的 15432）
# 即使误执行 `docker compose down -v`，也只会删掉这个沙箱卷。
#
# 启动：docker compose -f docker-compose.yml --env-file .env up -d
#   （.env 中的 DB_HOST_PORT 被忽略，本文件固定使用 DB_HOST_PORT_LOCAL，默认 55432）
# 连接：psql -h 127.0.0.1 -p 55432 -U <POSTGRES_USER> -d canvas_history
#
# 生产库请勿用本文件启动；生产库的启动/停止见 PROD compose.yaml。
# 校验：docker volume ls | grep canvas-history     # 不得出现新的生产卷

name: canvas-history-local

services:
  db:
    image: postgis/postgis:17-3.6
    container_name: canvas-history-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required, copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, copy .env.example to .env}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      # 仅本机可连：127.0.0.1:55432 -> 容器 5432
      - "127.0.0.1:${DB_HOST_PORT_LOCAL:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 七张暂存 CSV 的只读挂载点（本地导入演练用，容器内不可写）
      - ./data/staging:/staging:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: "256mb"
    networks:
      - local

volumes:
  pgdata:
    name: canvas-history-local-pgdata

networks:
  local:
    name: canvas-history-local-net
