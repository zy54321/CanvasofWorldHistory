server:
  port: ${API_PORT:8088}
  address: 127.0.0.1
  compression:
    enabled: true

spring:
  application:
    name: canvas-history-api
  datasource:
    # M1 阶段该连接是 read-only:true（只做查询）。M2-2A 引入人物/事件 CRUD，必须可写，
    # 故关闭连接级只读；地点相关接口（/places/**）在代码层面仍然只发 SELECT。
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/canvas_history}
    username: ${DB_USER:canvas_app}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: canvas-rw
      maximum-pool-size: 6
      minimum-idle: 1
      read-only: false
      connection-timeout: 5000
  # 迁移的唯一入口是 ops/flyway.sh；后端启动不得成为 DDL 入口
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

# 数据库写入白名单（M3 前置加固）。
#   - 按【实际连接的库名】判定（启动时查 current_database()），不看端口、不看配置里写的库名；
#   - 逗号分隔，精确匹配，不支持 * 通配；留空 = 全库禁止写入（fail-closed）；
#   - 不在名单内的实例，POST/PUT/PATCH/DELETE 一律 403，GET 不受影响。
# 正式库 canvas_history 默认不在名单里 → 8088 实例天然只读。
# 测试库需显式：DB_WRITE_ALLOWED_DATABASES=canvas_history_m2check
app:
  write:
    allowed-databases: ${DB_WRITE_ALLOWED_DATABASES:}

logging:
  level:
    root: INFO
    com.canvasofworldhistory: INFO
