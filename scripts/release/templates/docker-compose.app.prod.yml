# Dockerized PROD app ONLY. The existing database and its volume are never managed here.
# During migration use -p canvas-history, matching the existing DB's Compose project.
# Do not run docker compose down --volumes, and do not rename the DB project here.
services:
  app:
    image: ${CANVAS_APP_IMAGE:?CANVAS_APP_IMAGE is required}
    container_name: canvas-history-prod-app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://canvas-history-db:5432/canvas_history
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      DB_WRITE_ALLOWED_DATABASES: canvas_history
      SPRING_FLYWAY_ENABLED: "false"
      TZ: Asia/Shanghai
      API_PORT: "5180"
    ports:
      - "127.0.0.1:${API_PORT:-5180}:5180"
    volumes:
      - type: bind
        source: ${CANVAS_CONFIG_JS_PATH:?CANVAS_CONFIG_JS_PATH required}
        target: /app/web/config.js
        read_only: true
        bind:
          create_host_path: false
    networks: [production]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
networks:
  production:
    external: true
    name: canvas-history-net
