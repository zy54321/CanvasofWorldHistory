# Canvas of World History —— 生产数据库服务
#
# 用途：在目标机上以既有数据卷启动 PostgreSQL/PostGIS。
# 关键：卷名固定为 canvas-history-pgdata，指向**已有的生产数据卷**，
#       不会创建空库，也不会覆盖数据。
#
# 启动：docker compose -f docker-compose.prod.yml --env-file ../config/.env up -d
# 停止（保留数据）：docker compose -f docker-compose.prod.yml down
#
# 严禁使用 `down -v`：那会删除生产数据卷。

name: canvas-history

services:
  db:
    image: postgis/postgis:17-3.6
    container_name: canvas-history-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: "256mb"
    networks:
      - backend

volumes:
  pgdata:
    # external: true —— 明确声明使用**已存在**的生产数据卷。
    # 卷不存在时 `docker compose up` 会直接报错，而不是静默创建一个空卷
    # 再让 PostgreSQL 在上面初始化一个空库。
    #
    # 若确实需要从零恢复，应由人工显式创建卷并从备份恢复，
    # 绝不由本编排文件顺带完成。
    external: true
    name: canvas-history-pgdata

networks:
  backend:
    # 网络是可再生的基础设施，允许不存在时创建
    name: canvas-history-net
